<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip details</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fbfbfd;--soft:#f2f3f7;--wash:radial-gradient(900px 480px at 75% -120px,#ffe3d6 0%,rgba(255,227,214,0) 70%),radial-gradient(700px 400px at 0% 0,#fff1e9 0%,rgba(255,241,233,0) 65%);--card:#fff;--ink:#16161a;--mute:#797980;--line:#e8e9ef;--acc:#ee5a2a;--accf:#fff;--acc2:#fdebe4;--pb:#16161a;--pf:#fff;--ok:#15803d;--ok2:#e5f5ea;--warn:#b45309;--warn2:#fcf1de;--bad:#b91c1c;--bad2:#fde9e7;--sh:0 10px 30px rgba(20,20,30,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--wash) top/100% 560px no-repeat,var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit}
.ic{width:20px;height:20px;flex:none}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{position:sticky;top:12px;margin:12px 0 12px 12px;height:calc(100vh - 24px);height:calc(100dvh - 24px);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 12px 12px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;font-weight:700;font-size:16px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--pb);color:var(--pf);display:grid;place-items:center}
nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto}
nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;text-decoration:none;font-weight:500;color:var(--mute);transition:background .15s,color .15s}
nav a:hover{background:var(--soft);color:var(--ink)}
nav a.on{background:var(--pb);color:var(--pf)}
.callcard{background:var(--soft);border-radius:16px;padding:14px}
.callcard small{display:block;color:var(--mute);font-size:12.5px}
.callcard .num{display:block;margin:2px 0 10px;font-size:19px}
.callcard .btn{width:100%;justify-content:center}
main{padding:28px 32px 40px;max-width:1240px;width:100%;min-width:0;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;margin-bottom:26px}
.top h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em}
.top p{margin:2px 0 0;color:var(--mute);font-size:14px}
h2{font-size:22px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
h3{margin:0 0 2px;font-size:16px;font-weight:600}
.sub{color:var(--mute);margin:0 0 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(30,30,60,.04),0 6px 18px rgba(30,30,60,.04)}
.stat b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}
.stat span,.meta{color:var(--mute);font-size:13px}
.stat:first-child{background:var(--pb);border-color:var(--pb);color:var(--pf)}.stat:first-child span{color:inherit;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:14px}.grid.w{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 15px;min-height:36px;border-radius:99px;border:1px solid var(--line);background:var(--card);font:500 13px Inter,system-ui,sans-serif;text-decoration:none;cursor:pointer;color:var(--ink);transition:background .15s,opacity .15s}
.btn:hover{background:var(--soft)}
.btn.p{background:var(--pb);border-color:var(--pb);color:var(--pf)}.btn.p:hover{opacity:.85;background:var(--pb)}
.btn.c{background:var(--acc);border-color:var(--acc);color:var(--accf);font-weight:600}.btn.c:hover{opacity:.88;background:var(--acc)}
.btn:focus-visible,nav a:focus-visible,input:focus-visible,select:focus-visible,.pin:focus-visible,.fab button:focus-visible,.num:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.Y{background:var(--ok2);color:var(--ok)}.N{background:var(--bad2);color:var(--bad)}.P{background:var(--warn2);color:var(--warn)}.C{background:var(--acc2);color:var(--acc)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin-top:12px;font-size:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0;overflow-wrap:anywhere}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
input[type=search],select{flex:1;min-width:170px;min-height:42px;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chips button{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 13px Inter,system-ui,sans-serif;cursor:pointer;transition:background .15s}
.chips button:hover{background:var(--soft)}
.chips button.on,.btn.on{background:var(--pb);color:var(--pf);border-color:var(--pb)}
.stops{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.stops span{font-size:12px;background:var(--soft);border-radius:99px;padding:3px 9px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{color:var(--mute);font-weight:500;font-size:12.5px}
.note{background:var(--warn2);color:var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.pg{display:none}.pg.on{display:block}
.tl{display:grid;gap:10px}
.it{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.it.done{opacity:.55}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);margin-top:2px;flex:none;cursor:pointer}
.pnr{align-self:flex-start;font:600 15px ui-monospace,Menlo,monospace;background:var(--acc2);color:var(--acc);padding:4px 10px;border-radius:99px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;width:0;transition:width .3s}
.mapbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px}
.mapbox svg{width:100%;height:auto;display:block}
.pin{cursor:pointer}
.hero{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;padding:26px 28px;border-radius:24px;color:#fff;margin-bottom:20px;background:linear-gradient(120deg,#ff8a50 0%,#ee4f22 55%,#d9381a 100%);box-shadow:0 14px 34px rgba(238,90,42,.28)}
.hero>div{position:relative;z-index:1}.hero h2{font-size:30px;margin:2px 0 6px;letter-spacing:-.02em}.hero p{margin:0;opacity:.9}.hk{font-size:13px;font-weight:600;opacity:.85}
.hn{text-align:right}.hn b{display:block;font-size:56px;line-height:1;font-weight:700;letter-spacing:-.03em}.hn span{font-size:14px;opacity:.9}
.hm{position:absolute;right:0;bottom:0;width:70%;max-width:560px;height:auto;z-index:0}
@media (max-width:760px){.hero{padding:20px}.hero h2{font-size:24px}.hn b{font-size:44px}}
.call{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-bottom:24px}
.call>div{flex:1 1 170px}
.num{font:700 22px Inter,system-ui,sans-serif;letter-spacing:.01em;text-decoration:none;color:var(--ink)}
.foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;color:var(--mute);font-size:14px}
.foot .num{font-size:18px}.foot .r{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:30}
.fab button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh);transition:transform .15s,background .15s,color .15s,opacity .2s,visibility .2s}
.fab button:hover{background:var(--pb);color:var(--pf);transform:translateY(-2px)}
.fab button.off{opacity:0;visibility:hidden;pointer-events:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:50;max-width:90vw}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.ov div{background:var(--card);border-radius:18px;padding:14px;max-width:420px;max-height:90vh;overflow:auto}
.ov img{width:100%;display:block;border-radius:10px}
@media (max-width:1100px){.app{grid-template-columns:212px minmax(0,1fr)}main{padding:24px 22px 40px}.grid{grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr))}}
@media (pointer:coarse){.btn,.chips button{min-height:44px}}
@media (max-width:760px){
.app{display:block}
.side{display:contents}.brand,.callcard{display:none}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));flex-direction:row;gap:2px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);z-index:20;overflow-x:auto;overflow-y:hidden;flex:none}
nav a{flex:none;flex-direction:column;gap:2px;min-width:64px;min-height:50px;justify-content:center;padding:6px 10px;font-size:11px;white-space:nowrap}
main{padding:18px 14px 120px}
.top h1{font-size:24px}
.top>.row{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px}.top>.row .btn{flex:none;white-space:nowrap}
.stats{grid-template-columns:1fr 1fr}.stat b{font-size:22px}
.grid{grid-template-columns:1fr}
.fab{bottom:calc(86px + env(safe-area-inset-bottom,0px));right:12px}
.foot{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
@media print{.side,.noprint,.toast,.ov,.fab,.foot{display:none!important}.app{display:block}main{padding:0;max-width:none}.pg{display:none}.pg.on{display:block}body.all .pg{display:block;break-after:page}.card,.it{break-inside:avoid}}

/* ---- agent + responsive additions ---- */
html{-webkit-tap-highlight-color:transparent}
img,svg{max-width:100%}
.meta,h3,.sub{overflow-wrap:anywhere}
.it>div{min-width:0}
.btn.wa{background:#0f8a4f;border-color:#0f8a4f;color:#fff;font-weight:600}.btn.wa:hover{background:#0c7442;opacity:1}
.av{width:52px;height:52px;border-radius:16px;background:var(--pb);color:var(--pf);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.agh{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px}
.acts .btn{width:100%}
.callcard b{display:block;font-size:15px}
.callcard .stk{display:grid;gap:8px;margin-top:10px}.callcard .stk .btn{width:100%}
.mini{display:block;color:var(--mute);font-size:12.5px}
.foot b{color:var(--ink)}.foot a:not(.btn){color:var(--ink);text-underline-offset:3px}
.foot .r .btn{min-height:40px}
.msg{white-space:pre-line}
.sec{margin:26px 0 10px}
#tracker td:nth-child(2),#mpanel td:nth-child(2){white-space:normal;min-width:130px}
@media (min-width:1500px){.app{grid-template-columns:268px minmax(0,1fr)}main{max-width:1360px;padding:32px 40px 48px}}
@media (max-width:1100px) and (min-width:761px){.top h1{font-size:25px}.hero h2{font-size:26px}}
@media (max-width:760px){
.mapbox{overflow-x:auto;-webkit-overflow-scrolling:touch}.mapbox svg{min-width:640px}
.chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;margin-right:-14px;padding-right:14px}.chips button{flex:none;white-space:nowrap}
td,th{padding:9px 8px}
.tools input[type=search],.tools select{min-width:0;flex:1 1 100%}
.toast{bottom:104px}
.card,.stat{padding:15px}
.acts>.btn:last-child:nth-child(odd){grid-column:1/-1}
.foot .r{width:100%}
.foot .r .btn{flex:1 1 0}
.hero{align-items:flex-start}.hn{text-align:left}
}
@media (max-width:380px){
main{padding:14px 12px 120px}
.stats{grid-template-columns:1fr 1fr;gap:8px}.stat b{font-size:20px}
.top h1{font-size:22px}.hero h2{font-size:21px}.hn b{font-size:38px}
.kv{grid-template-columns:1fr;gap:0}.kv dt{margin-top:8px;font-size:12.5px}
nav a{min-width:58px;padding:6px 8px}
.av{width:44px;height:44px;font-size:16px}
}
@media (max-height:520px) and (min-width:761px){.side{position:static;height:auto}.callcard{display:none}}

/* ---- contacts + camera ---- */
#sidecall{display:grid;gap:8px}
.callcard .stk.two{grid-template-columns:1fr 1fr}.callcard .stk.two .btn{padding:8px 6px}
.card.me{border-color:var(--acc);background:linear-gradient(180deg,var(--acc2),var(--card) 70%)}
@media (min-width:1000px){.tl{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.foot .r .btn{flex:1 1 44%}}
.cam{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start;margin-bottom:20px}
@media (max-width:760px){.cam{grid-template-columns:1fr}}
.vw{position:relative;aspect-ratio:3/4;max-height:72vh;width:100%;background:#0b0b0e;border-radius:22px;overflow:hidden}
.vw video,.rvw>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.cmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;padding:24px;font-size:14px}
.rt{position:absolute;top:12px;left:12px;z-index:2;background:#e11d48;color:#fff;border-radius:99px;padding:3px 11px;font:600 13px ui-monospace,Menlo,monospace}
.rvw{position:absolute;inset:0;z-index:1}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 4px}
.ctl .btn{min-width:104px}
.shut{width:72px;height:72px;border-radius:50%;border:4px solid var(--ink);background:var(--acc);box-shadow:inset 0 0 0 4px var(--card);cursor:pointer;transition:border-radius .15s,background .15s}
.shut.rec{background:#e11d48;border-radius:20px}.shut:disabled{opacity:.35;cursor:default}
.shut:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fl .full{grid-column:1/-1}
.fl label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:3px}
.fl input,.fl select{width:100%;min-width:0;flex:none}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.gi{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.th{display:block;position:relative;width:100%;aspect-ratio:1;padding:0;border:0;background:#000;cursor:pointer}
.th img,.th video{width:100%;height:100%;object-fit:cover;display:block}
.vb{position:absolute;left:8px;bottom:8px;font:600 11px Inter,sans-serif;background:rgba(0,0,0,.65);color:#fff;border-radius:99px;padding:2px 8px;font-style:normal}
.gm{padding:10px 12px 12px;font-size:12.5px}.gm .row{margin-top:8px}.gm .btn{padding:6px 12px;min-height:34px}
.ov.lb div{max-width:min(94vw,860px)}.ov.lb .row{padding:0;background:none}.ov video{width:100%;display:block;border-radius:10px}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand"><span class="logo"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20l6-12 4 7 3-5 5 10z"/></svg></span>Trip details</div>
<nav aria-label="Pages"><a href="#home"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Overview</a><a href="#train"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8 21l2-4M16 21l-2-4"/></svg>Trains</a><a href="#stays"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/></svg>Stays</a><a href="#routes"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg>Routes</a><a href="#map"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/></svg>Map</a><a href="#places"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Places</a><a href="#tracker"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>Tracker</a><a href="#camera"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Camera</a><a href="#agent"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Agent</a></nav>
<div id="sidecall"></div></aside>
<main>
<div class="top"><div><h1>Trip details</h1><p>5 – 22 Dec 2026 · Ashish &amp; Priyanka</p></div>
<div class="row noprint" style="margin:0"><button class="btn p" data-act="pdf">Save PDF</button><button class="btn" data-act="pdfall">PDF of all pages</button><button class="btn" data-act="wa">Share on WhatsApp</button><button class="btn" data-act="share">Share</button><button class="btn" data-act="img">Share as image</button></div></div>
<section class="pg" id="home"></section>
<section class="pg" id="train"></section>
<section class="pg" id="stays"></section>
<section class="pg" id="routes"></section>
<section class="pg" id="map"></section>
<section class="pg" id="places"></section>
<section class="pg" id="tracker"></section>
<section class="pg" id="camera"></section>
<section class="pg" id="agent"></section>
<footer class="foot" id="foot"></footer>
</main>
</div>
<div class="fab" aria-label="Scroll controls"><button id="up" class="off" type="button" aria-label="Scroll to top"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button><button id="dn" type="button" aria-label="Scroll to bottom"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button></div>
<script>
const G="https://www.google.com/maps/";
const q=s=>encodeURIComponent(s);
const pin=s=>G+"search/?api=1&query="+q(s);
const nav=s=>G+"dir/?api=1&travelmode=driving&destination="+q(s);
const inr=n=>n==null?"Not provided":"₹"+n.toLocaleString("en-IN");

async function sub(d,n){for await(const[k,h] of d.entries())if(h.kind=="directory"&&k.toLowerCase()==n.toLowerCase())return h;return d.getDirectoryHandle(n,{create:true})}

function fstat(){const ok=!!window.showDirectoryPicker;$("cfs").textContent=fdir?"Saving into your folder \""+fdir.name+"\". Subfolders are created once and reused. A copy also stays in the gallery below.":ok?"No folder chosen yet. Files stay in the gallery below until you choose one.":"This browser can't write to folders directly. Files stay in the gallery below. Use Download or ZIP to get them with their folders.";$("cdir").hidden=!ok;$("cdir").textContent=fdir?"Change folder":"Choose folder"}

// camera
let strm=null,fm="environment",mode="photo",mr=null,chunks=[],tmr=0,t0=0,cur=null,shown=[];
const rc=()=>mr&&mr.state=="recording";
function ui(){const on=!!strm;$("cm").hidden=on||!!cur;$("rv").hidden=!cur;$("cb2").hidden=!cur;$("cb1").hidden=!!cur;$("con").hidden=on;$("coff").hidden=!on;$("ct").hidden=!rc();if(rc()){const s=Math.floor((Date.now()-t0)/1e3);$("ct").textContent="● "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
$("cshut").className="shut"+(rc()?" rec":"");$("cshut").disabled=!!cur||!on;$("cshut").setAttribute("aria-label",mode=="photo"?"Take photo":rc()?"Stop recording":"Start recording");$("cmode").textContent="Mode: "+(mode=="photo"?"Photo":"Video");$("cmode").disabled=$("cflip").disabled=rc()}
async function camOn(){camOff();if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$("cm").textContent="Camera needs a secure (https) page and a browser that supports it.";return}
try{strm=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:fm},width:{ideal:1920},height:{ideal:1080}},audio:mode=="video"});const v=$("cv");v.srcObject=strm;v.style.transform=fm=="user"?"scaleX(-1)":"";await v.play().catch(()=>{})}catch(e){strm=null;$("cm").textContent=e.name=="NotAllowedError"?"Camera permission was blocked. Allow it in the browser's site settings, then tap Start camera.":"Couldn't start the camera ("+e.name+")."}ui()}
function camOff(){if(rc())mr.stop();if(strm){strm.getTracks().forEach(t=>t.stop());strm=null}const v=$("cv");if(v)v.srcObject=null;if($("cm"))ui()}
function review(kind,blob){const u=URL.createObjectURL(blob);cur={kind,blob,u};$("rv").innerHTML=kind=="photo"?`<img src="${u}" alt="Captured photo">`:`<video src="${u}" controls playsinline></video>`;ui()}

function shot(){const v=$("cv");if(!v.videoWidth)return;const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);c.toBlob(b=>b&&review("photo",b),"image/jpeg",.92)}
function recToggle(){if(rc()){mr.stop();return}const m=["video/mp4","video/webm;codecs=vp9,opus","video/webm"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));if(!m){toast("Video recording isn't supported in this browser");return}
chunks=[];mr=new MediaRecorder(strm,{mimeType:m});mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);mr.onstop=()=>{clearInterval(tmr);review("video",new Blob(chunks,{type:m.split(";")[0]}))};mr.start(1000);t0=Date.now();tmr=setInterval(ui,500);ui()}
function fname(kind,L){const d=new Date(),p=n=>String(n).padStart(2,"0"),s=""+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+"_"+String(d.getMilliseconds()).padStart(3,"0");return s+"_"+(L[L.length-1]||"media").replace(/ /g,"-").slice(0,40)+"."+ext(kind)}
async function saveCur(){if(!cur)return;const L=lp(),cat=san($("ccat").value)||"Uncategorised",kind=cur.kind,r={kind,mime:cur.blob.type,blob:cur.blob,ts:Date.now(),cat,gps:gpsPos,loc:Object.fromEntries(F.map(([k])=>[k,fv(k)])),path:[...L,cat,kind=="video"?"Videos":"Photos"].join("/"),name:fname(kind,L)};
let m="Saved in the gallery. Use Download or ZIP to keep it.";
if(fdir){if(await perm(true)){try{await put(r);r.folder=1;m="Saved to "+fdir.name+"/"+r.path}catch(e){m="Folder save failed ("+e.name+"). Kept in the gallery."}}else m="Folder access not allowed. Kept in the gallery."}
try{await tx("media","readwrite",o=>o.add(r))}catch(e){m="Couldn't store in the gallery ("+e.name+")"}toast(m);discard();gal()}

$("gtools").innerHTML=sel("country","Country")+sel("city","City / town")+sel("place","Place")+sel("cat","Category")+`<div class="chips" style="margin:0;width:100%">${[["all","All"],["photo","Photos"],["video","Videos"]].map(([k,l])=>`<button type="button" data-gk="${k}" class="${gf.kind==k?"on":""}">${l}</button>`).join("")}</div>`;
shown=gr.filter(r=>(gf.kind=="all"||r.kind==gf.kind)&&["country","city","place","cat"].every(k=>!gf[k]||gl[k](r)==gf[k]));
gu.forEach(u=>URL.revokeObjectURL(u));gu=[];
$("gg").innerHTML=shown.length?shown.map(r=>{const u=URL.createObjectURL(r.blob);gu.push(u);return`<div class="gi"><button class="th" type="button" data-o="${r.id}" aria-label="Open">${r.kind=="photo"?`<img src="${u}" alt="" loading="lazy">`:`<video src="${u}#t=0.1" preload="metadata" muted playsinline></video><i class="vb">Video</i>`}</button><div class="gm"><b>${E(new Date(r.ts).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"}))}</b><div class="meta">${E([lc(r),r.loc.place,r.cat].filter(Boolean).join(" · "))}</div><div class="row"><button class="btn" type="button" data-d="${r.id}">Download</button><button class="btn" type="button" data-x="${r.id}">Delete</button></div></div></div>`}).join(""):`<p class="meta">Nothing here yet. Saved photos and videos appear here.</p>`}
function dl1(blob,name){const u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function openR(r){const u=URL.createObjectURL(r.blob),o=document.createElement("div");o.className="ov lb";o.innerHTML=`<div>${r.kind=="photo"?`<img src="${u}" alt="">`:`<video src="${u}" controls autoplay playsinline></video>`}<p class="meta">${E(new Date(r.ts).toLocaleString())}<br>${E(r.path)}</p><div class="row"><button class="btn p" data-d="${r.id}">Download</button><button class="btn" data-c="1">Close</button></div></div>`;o.onclick=e=>{if(e.target==o||e.target.dataset.c){URL.revokeObjectURL(u);o.remove()}};document.body.appendChild(o)}
async function delR(r){if(!confirm("Delete this file from the gallery"+(r.folder?" and from your folder":"")+"?"))return;if(r.folder&&await perm(false)){try{let d=fdir;for(const s of r.path.split("/"))d=await sub(d,s);await d.removeEntry(r.name)}catch(e){}}await tx("media","readwrite",o=>o.delete(r.id));toast("Deleted");gal()}
// ZIP (stored, no compression) keeps the folder structure when direct folder access isn't available
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=-1;for(let i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0};
async function zip(list){const en=new TextEncoder(),parts=[],cd=[];let off=0,cs=0;
for(const r of list){const nm=en.encode(r.path+"/"+r.name),d=new Uint8Array(await r.blob.arrayBuffer()),c=crc(d),t=new Date(r.ts),tm=(t.getHours()<<11)|(t.getMinutes()<<5)|(t.getSeconds()>>1),dd=((t.getFullYear()-1980)<<9)|((t.getMonth()+1)<<5)|t.getDate();
const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(10,tm,true);h.setUint16(12,dd,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);parts.push(h.buffer,nm,d);
const e=new DataView(new ArrayBuffer(46));e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x800,true);e.setUint16(12,tm,true);e.setUint16(14,dd,true);e.setUint32(16,c,true);e.setUint32(20,d.length,true);e.setUint32(24,d.length,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);cd.push(e.buffer,nm);cs+=46+nm.length;off+=30+nm.length+d.length}
const z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,true);z.setUint16(8,list.length,true);z.setUint16(10,list.length,true);z.setUint32(12,cs,true);z.setUint32(16,off,true);return new Blob([...parts,...cd,z.buffer],{type:"application/zip"})}

let gpsPos=null;
const ext=(k)=>{const t=cur.blob.type;return t.includes("png")?"png":t.includes("heic")?"heic":t.includes("mp4")?"mp4":t.includes("quicktime")?"mov":t.includes("webm")?"webm":k=="photo"?"jpg":"mp4"};
function gps(){return new Promise(ok=>{if(!$("cgps").checked||!navigator.geolocation)return ok();navigator.geolocation.getCurrentPosition(p=>{const a=p.coords.latitude,b=p.coords.longitude;let best,bd=1e9;for(const[n,c]of Object.entries({...CO,Khajjiar:[32.55,76.06]})){const d=Math.hypot((c[0]-a)*111,(c[1]-b)*111*Math.cos(a*Math.PI/180));if(d<bd){bd=d;best=n}}gpsPos={lat:+a.toFixed(5),lon:+b.toFixed(5)};if(bd<45){const n={"Bir Billing":"Bir",Tirthan:"Tirthan Valley"}[best]||best;stopPick(n);$("cstop").value=n;toast("GPS: near "+n)}else toast("GPS read, but you are not near a trip stop. Pick the place yourself.");ok()},()=>{toast("GPS blocked or unavailable. Pick the place yourself.");ok()},{enableHighAccuracy:true,timeout:10000,maximumAge:60000})})}
const GUESS=[[/temple|mandir|gurudwara|church|monastery|sahib/i,"Temples and monuments"],[/waterfall/i,"Waterfalls"],[/river|lake/i,"Rivers"],[/fort|bagh|heritage|stadium/i,"Historical places"],[/market|bazaar|mall road|chowk|street/i,"Streets and markets"],[/hotel|stay|homestay|inn|resort|retreat/i,"Hotels and stays"],[/peak|valley|pass|snow|trek|ropeway|tunnel/i,"Mountains"],[/forest|sanctuary|meadow|garden|trail|park|vihar/i,"Forests"]];
function guessCat(){const c=$("ccat");if(c.value&&!c.dataset.auto)return;const t=fv("place")+" "+fv("stay"),g=GUESS.find(x=>x[0].test(t));if(g){c.value=g[1];c.dataset.auto=1;saveLoc();paths()}}
async function nativePick(e,kind){const f=e.target.files[0];e.target.value="";if(!f)return;await gps();review(kind,f)}
function camStop(){camOff()}
function camInit(){
$("camera").innerHTML=`<h2>Camera</h2><p class="sub">Take photos and videos and file them by place and category. Everything stays on this device. Your GPS location is never read.</p>
<div class="cam"><div><div class="vw"><video id="cv" playsinline muted></video><div class="cmsg" id="cm">Camera is off. Tap Start camera.</div><span class="rt" id="ct" hidden></span><div class="rvw" id="rv" hidden></div></div>
<div class="ctl"><button class="btn" id="cflip" type="button">Flip</button><button class="shut" id="cshut" type="button"></button><button class="btn" id="cmode" type="button"></button></div>
<div class="row" id="cb1" style="justify-content:center"><button class="btn c" id="nph" type="button">Open phone camera: Photo</button><button class="btn c" id="nvd" type="button">Open phone camera: Video</button><input type="file" id="fph" accept="image/*" capture="environment" hidden><input type="file" id="fvd" accept="video/*" capture="environment" hidden><button class="btn p" id="con" type="button">Use in-page camera</button><button class="btn" id="coff" type="button">Stop camera</button></div>
<div class="row" id="cb2" style="justify-content:center" hidden><button class="btn c" id="csave" type="button">Save</button><button class="btn p" id="cshare" type="button">Save to phone gallery</button><button class="btn" id="cretake" type="button">Retake</button><button class="btn" id="cdel" type="button">Delete</button></div></div>
<div class="card"><h3>Where is this?</h3><div class="meta">Pick a trip stop or type any name. Each list narrows as you choose.</div><div class="fl" style="margin-top:12px"><div class="full"><label style="display:flex;gap:8px;align-items:flex-start;color:var(--ink)"><input type="checkbox" id="cgps" style="margin-top:2px"><span>Fill the trip stop from my GPS when I take a photo. Off by default. Your position is only used on this device and is never uploaded.</span></label></div><div class="full"><label for="cstop">Trip stop</label><select id="cstop"><option value="">Custom</option>${STOPS.map(s=>`<option>${s}</option>`).join("")}</select></div>${F.map(([k,l])=>`<div><label for="cf-${k}">${l}</label><input type="search" id="cf-${k}" list="dl-${k}" autocomplete="off" placeholder="Search or type"><datalist id="dl-${k}"></datalist></div>`).join("")}<div class="full"><label for="ccat">Category</label><input type="search" id="ccat" list="dl-cat" autocomplete="off" placeholder="Search or type your own"><datalist id="dl-cat">${CAT.map(c=>`<option value="${c}">`).join("")}</datalist></div></div><div class="meta" style="margin-top:12px">Folder: <b id="cpath"></b></div></div></div>

<h3 style="margin-bottom:10px">Gallery</h3><div class="tools noprint" id="gtools"></div><div class="row noprint" style="margin:0 0 12px"><button class="btn" id="gzip" type="button">Download ZIP of shown</button></div><div class="gg" id="gg"></div>`;
const V=ls.get("camloc",{});F.forEach(([k])=>setv(k,V[k]||""));$("ccat").value=V.cat||"";if(!fv("country"))setv("country","India");dls();paths();ui();fstat();gal();
tx("kv","readonly",o=>o.get("dir")).then(h=>{fdir=h||null;fstat()}).catch(()=>fstat());

$("nph").onclick=()=>$("fph").click();$("nvd").onclick=()=>$("fvd").click();$("fph").onchange=e=>nativePick(e,"photo");$("fvd").onchange=e=>nativePick(e,"video");$("cshare").onclick=()=>{const f=new File([cur.blob],fname(cur.kind,lp()),{type:cur.blob.type});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else toast("This browser can't share files. Use Save, then Download.")};$("con").onclick=camOn;$("coff").onclick=camOff;
